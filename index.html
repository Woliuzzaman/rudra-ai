<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>রুদ্র এআই</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b1020; color: #e8ecf5;
    font-family: "Noto Sans Bengali", "Kalpurush", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 16px; text-align: center; font-size: 20px; font-weight: 700; border-bottom: 1px solid #1d2540; }
  header small { display: block; font-size: 12px; font-weight: 400; color: #8b95b5; margin-top: 2px; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2b5cff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1a2240; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: #8b95b5; font-size: 13px; }
  #quick { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; }
  #quick button { flex: none; background: #1a2240; color: #cfd6ee; border: 1px solid #2a3560; border-radius: 18px; padding: 8px 14px; font-size: 14px; font-family: inherit; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #1d2540; }
  #txt { flex: 1; background: #141b33; color: #e8ecf5; border: 1px solid #2a3560; border-radius: 22px; padding: 12px 16px; font-size: 16px; font-family: inherit; outline: none; }
  .btn { width: 48px; height: 48px; border-radius: 50%; border: none; color: #fff; font-size: 22px; flex: none; }
  #send { background: #2b5cff; }
  #mic { background: #e5484d; width: 56px; height: 56px; }
  #mic.on { animation: pulse 1s infinite; background: #ff2d55; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,45,85,.6); } 100% { box-shadow: 0 0 0 18px rgba(255,45,85,0); } }
</style>
</head>
<body>
<header>রুদ্র এআই<small>আপনার বাংলা ভয়েস অ্যাসিস্ট্যান্ট</small></header>
<div id="chat"><div class="msg sys">মাইক চেপে বাংলায় কথা বলুন অথবা নিচে লিখুন</div></div>
<div id="quick">
  <button>আজকের তারিখ কত?</button>
  <button>একটা ছোট গল্প বলো</button>
  <button>আজকের জন্য একটা ভালো কথা বলো</button>
  <button>একটা মজার ধাঁধা দাও</button>
</div>
<div id="bar">
  <input id="txt" type="text" placeholder="এখানে লিখুন..." autocomplete="off">
  <button id="send" class="btn" aria-label="পাঠান">➤</button>
  <button id="mic" class="btn" aria-label="কথা বলুন">🎤</button>
</div>

<script>
const chat = document.getElementById("chat");
const txt = document.getElementById("txt");
const micBtn = document.getElementById("mic");
let history = [];
let busy = false;

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "bn-BD";
  const v = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("bn"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true;
  txt.value = "";
  addMsg(text, "user");
  const wait = addMsg("ভাবছি... (প্রথমবার ৫০ সেকেন্ড পর্যন্ত লাগতে পারে)", "sys");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history })
    });
    const data = await r.json();
    wait.remove();
    if (!r.ok || data.error) {
      addMsg("সমস্যা: " + (data.error || "অজানা ত্রুটি"), "sys");
    } else {
      addMsg(data.reply, "bot");
      history.push({ role: "user", content: text }, { role: "assistant", content: data.reply });
      history = history.slice(-10);
      speak(data.reply);
    }
  } catch (e) {
    wait.remove();
    addMsg("সংযোগে সমস্যা হয়েছে। ইন্টারনেট দেখে আবার চেষ্টা করুন।", "sys");
  }
  busy = false;
}

document.getElementById("send").onclick = () => send(txt.value);
txt.addEventListener("keydown", e => { if (e.key === "Enter") send(txt.value); });
document.querySelectorAll("#quick button").forEach(b => b.onclick = () => send(b.textContent));

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = "bn-BD";
  rec.interimResults = false;
  rec.onstart = () => micBtn.classList.add("on");
  rec.onend = () => micBtn.classList.remove("on");
  rec.onerror = () => { micBtn.classList.remove("on"); addMsg("মাইক কাজ করছে না। মাইকের অনুমতি দিন বা লিখে পাঠান।", "sys"); };
  rec.onresult = e => send(e.results[0][0].transcript);
}
micBtn.onclick = () => {
  if (!rec) { addMsg("এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করুন।", "sys"); return; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  try { rec.start(); } catch (e) { rec.stop(); }
};
</script>
</body>
</html>
